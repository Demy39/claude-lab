<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demy · 自我介紹</title>
<style>
  :root {
    --space-900: #04070f;
    --space-800: #070d1c;
    --space-700: #0b1530;
    --space-600: #122045;

    --nebula-a: rgba(78, 126, 255, 0.30);
    --nebula-b: rgba(150, 108, 255, 0.22);
    --nebula-c: rgba(64, 214, 255, 0.16);

    --card-bg: rgba(14, 24, 50, 0.55);
    --card-border: rgba(174, 200, 255, 0.20);

    --star: #f4f8ff;
    --text: #eaf1ff;
    --text-soft: rgba(200, 216, 255, 0.66);
    --accent: #8fb4ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--space-900); }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei",
                 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 70% 55% at 18% 12%, var(--nebula-a), transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 25%, var(--nebula-b), transparent 62%),
      radial-gradient(ellipse 80% 60% at 60% 100%, var(--nebula-c), transparent 65%),
      linear-gradient(170deg, var(--space-800) 0%, var(--space-700) 45%, var(--space-900) 100%);
    background-attachment: fixed;
  }

  /* 星空層：兩層不同大小與速度的星點，營造深度 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: -50% -50%;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, var(--star), transparent 100%),
      radial-gradient(1.2px 1.2px at 28% 62%, rgba(244,248,255,0.85), transparent 100%),
      radial-gradient(1.8px 1.8px at 44% 8%,  var(--star), transparent 100%),
      radial-gradient(1.1px 1.1px at 57% 41%, rgba(200,220,255,0.8), transparent 100%),
      radial-gradient(1.5px 1.5px at 71% 76%, var(--star), transparent 100%),
      radial-gradient(1.3px 1.3px at 83% 29%, rgba(244,248,255,0.9), transparent 100%),
      radial-gradient(1.7px 1.7px at 94% 58%, var(--star), transparent 100%),
      radial-gradient(1.2px 1.2px at 6%  84%, rgba(190,214,255,0.75), transparent 100%),
      radial-gradient(1.4px 1.4px at 36% 92%, var(--star), transparent 100%),
      radial-gradient(1.1px 1.1px at 64% 15%, rgba(244,248,255,0.7), transparent 100%);
    background-size: 620px 620px;
    opacity: 0.9;
    animation: drift 150s linear infinite, twinkle 5.5s ease-in-out infinite;
  }

  body::after {
    background-image:
      radial-gradient(2.4px 2.4px at 22% 34%, rgba(255,255,255,0.95), transparent 100%),
      radial-gradient(2.1px 2.1px at 68% 66%, rgba(178,206,255,0.9), transparent 100%),
      radial-gradient(2.6px 2.6px at 88% 12%, rgba(255,255,255,0.9), transparent 100%),
      radial-gradient(2.0px 2.0px at 41% 79%, rgba(214,230,255,0.85), transparent 100%);
    background-size: 980px 980px;
    opacity: 0.55;
    animation: drift 240s linear infinite reverse, twinkle 8s ease-in-out infinite 1.5s;
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-620px, -310px, 0); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 0.45; }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    padding: 48px 40px 40px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    box-shadow:
      0 32px 80px rgba(0, 4, 18, 0.62),
      0 0 0 1px rgba(120, 160, 255, 0.06),
      inset 0 1px 0 rgba(214, 232, 255, 0.16);
    animation: floatIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* 卡片邊緣的極光光暈 */
  .card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(140deg,
      rgba(143, 180, 255, 0.55),
      rgba(160, 120, 255, 0.18) 38%,
      transparent 62%,
      rgba(96, 214, 255, 0.40));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    position: relative;
    width: 104px;
    height: 104px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 1px;
    border-radius: 50%;
    color: var(--star);
    background:
      radial-gradient(circle at 32% 28%, rgba(154, 190, 255, 0.42), transparent 58%),
      linear-gradient(135deg, rgba(30, 52, 110, 0.9), rgba(10, 18, 42, 0.9));
    border: 1px solid rgba(168, 200, 255, 0.45);
    box-shadow:
      0 12px 34px rgba(0, 6, 26, 0.55),
      0 0 34px rgba(110, 158, 255, 0.28),
      inset 0 0 22px rgba(120, 170, 255, 0.18);
    text-shadow: 0 0 18px rgba(160, 200, 255, 0.65);
  }

  /* 頭像外的行星軌道環 */
  .avatar::after {
    content: "";
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    border: 1px solid rgba(150, 190, 255, 0.22);
    border-top-color: rgba(180, 214, 255, 0.65);
    animation: orbit 9s linear infinite;
  }

  @keyframes orbit {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow:
      0 0 24px rgba(130, 175, 255, 0.45),
      0 2px 12px rgba(0, 0, 0, 0.5);
  }

  .subtitle {
    margin-top: 8px;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-soft);
  }

  .divider {
    width: 120px;
    height: 1px;
    margin: 28px auto;
    border-radius: 3px;
    background: linear-gradient(90deg,
      transparent,
      rgba(160, 198, 255, 0.85) 50%,
      transparent);
    box-shadow: 0 0 12px rgba(140, 185, 255, 0.6);
  }

  .section-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--text-soft);
    margin-bottom: 14px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .tag {
    padding: 9px 18px;
    font-size: 15px;
    border-radius: 999px;
    color: var(--text);
    background: rgba(112, 152, 235, 0.12);
    border: 1px solid rgba(160, 196, 255, 0.24);
    transition: transform 0.25s ease, background 0.25s ease,
                box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .tag:hover {
    transform: translateY(-3px);
    background: rgba(130, 175, 255, 0.24);
    border-color: rgba(190, 218, 255, 0.55);
    box-shadow: 0 8px 24px rgba(0, 8, 30, 0.5), 0 0 20px rgba(120, 170, 255, 0.32);
  }

  blockquote {
    margin-top: 34px;
    padding: 22px 24px;
    font-size: 18px;
    line-height: 1.8;
    font-style: italic;
    color: rgba(226, 236, 255, 0.94);
    border-left: 2px solid var(--accent);
    border-radius: 0 14px 14px 0;
    background: linear-gradient(90deg,
      rgba(96, 140, 235, 0.16),
      rgba(96, 140, 235, 0.04));
    box-shadow: -8px 0 22px -12px rgba(140, 185, 255, 0.8);
    text-align: left;
  }

  footer {
    margin-top: 30px;
    font-size: 13px;
    letter-spacing: 1px;
    color: rgba(178, 198, 240, 0.5);
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px 30px; }
    h1 { font-size: 30px; }
    blockquote { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before,
    body::after,
    .avatar::after,
    .card { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">D</div>

    <h1>Demy</h1>
    <p class="subtitle">Hello, World</p>

    <div class="divider"></div>

    <p class="section-label">興 趣</p>
    <div class="tags">
      <span class="tag">☕ 咖啡</span>
      <span class="tag">📚 閱讀</span>
      <span class="tag">🎧 音樂</span>
      <span class="tag">💻 寫程式</span>
      <span class="tag">🏞️ 旅行</span>
    </div>

    <blockquote>「保持好奇，慢慢來比較快。」</blockquote>

    <footer>© 2026 Demy · 用一頁認識我</footer>
  </main>
</body>
</html>
